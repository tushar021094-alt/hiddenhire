name: CI

permissions:
  contents: write

on:
  push:
    branches: ["main", "production-v1", "chore/security-audit-ci"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Temporary lockfile regeneration to let CI produce a canonical lockfile
      # for the pinned security upgrade. This step is removed after the artifact
      # is committed and normal npm ci validation passes.
      - name: Regenerate lockfile for patched dependency pins
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit dependencies
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit=$?
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (item.via ?? []).map(v => typeof v === "string" ? v : v.title).join("; ");
              console.log(JSON.stringify({ package: name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via }));
            }
          '
          echo "Full dependency audit exit code (including dev tooling): $audit_exit"
          echo "Blocking audit checks production dependencies only."
          npm audit --omit=dev
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiddenhire-audit-and-lockfile-refresh
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: ignore
      - name: Commit regenerated lockfile to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/hiddenhire-package-lock.json"
          git fetch origin "$HEAD_REF"
          git checkout --detach FETCH_HEAD
          cp "$RUNNER_TEMP/hiddenhire-package-lock.json" package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The branch already has this generated lockfile."
            exit 0
          fi
          git commit -m "fix(deps): regenerate lockfile for patched Next.js"
          git push origin "HEAD:$HEAD_REF"
