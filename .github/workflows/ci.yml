name: CI

on:
  push:
    branches: ["main", "production-v1", "chore/security-audit-ci"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit dependencies
        if: always()
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_exit=$?
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (item.via ?? []).map(v => typeof v === "string" ? v : v.title).join("; ");
              console.log(JSON.stringify({ package: name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable, via }));
            }
          '
          echo "Full dependency audit exit code (including dev tooling): $audit_exit"
          echo "Blocking audit checks production dependencies only."
          npm audit --omit=dev
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiddenhire-npm-audit
          path: npm-audit.json
          if-no-files-found: ignore
